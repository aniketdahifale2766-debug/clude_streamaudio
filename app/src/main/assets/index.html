<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WiFi Audio Stream</title>
<style>
  body { font-family: sans-serif; background:#111; color:#eee; text-align:center; padding-top:40px; }
  button { font-size:18px; padding:12px 24px; border-radius:8px; border:none; background:#1565C0; color:white; }
  input[type=range] { width: 80%; }
  #status { margin-top: 20px; color: #9ad; }
  #status.error { color: #f88; }
</style>
</head>
<body>
  <h2>WiFi Audio Stream</h2>
  <button id="startBtn">Tap to Start Listening</button>
  <div id="status">Not connected</div>
  <div style="margin-top:30px;">
    <label>Latency: <span id="latencyLabel">200</span> ms</label><br/>
    <input type="range" id="latencySlider" min="80" max="1000" value="200" />
  </div>

<script>
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');
const slider = document.getElementById('latencySlider');
const latencyLabel = document.getElementById('latencyLabel');

let audioCtx, workletNode, socket;
let usingFallback = false;
let fallbackRing = null;
let targetLatencyMs = parseInt(slider.value, 10);

function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.classList.toggle('error', !!isError);
}

slider.addEventListener('input', () => {
  targetLatencyMs = parseInt(slider.value, 10);
  latencyLabel.textContent = targetLatencyMs;
  if (workletNode) {
    workletNode.port.postMessage({ type: 'setLatency', value: targetLatencyMs });
  }
  if (usingFallback && fallbackRing && audioCtx) {
    fallbackRing.targetSamples = Math.floor(audioCtx.sampleRate * (targetLatencyMs / 1000) * 2);
    fallbackRing.trimTo(fallbackRing.targetSamples);
  }
});

// Fixed-size ring buffer: O(1) read/write, no array shifting, no GC churn.
// Old data is silently overwritten if the writer runs far ahead of the reader.
class RingBuffer {
  constructor(capacitySamples) {
    this.capacity = capacitySamples;
    this.buf = new Float32Array(capacitySamples);
    this.writeIdx = 0;
    this.readIdx = 0;
    this.available = 0;
  }
  write(samples) {
    for (let i = 0; i < samples.length; i++) {
      this.buf[this.writeIdx] = samples[i];
      this.writeIdx = (this.writeIdx + 1) % this.capacity;
      if (this.available < this.capacity) {
        this.available++;
      } else {
        this.readIdx = (this.readIdx + 1) % this.capacity;
      }
    }
  }
  read() {
    if (this.available <= 0) return 0;
    const v = this.buf[this.readIdx];
    this.readIdx = (this.readIdx + 1) % this.capacity;
    this.available--;
    return v;
  }
  // Immediately drop the oldest samples down to maxAvailable, so a latency
  // decrease takes effect right away instead of waiting for a natural underrun.
  trimTo(maxAvailable) {
    while (this.available > maxAvailable) {
      this.readIdx = (this.readIdx + 1) % this.capacity;
      this.available--;
    }
  }
}

// AudioWorklet path (secure contexts only — HTTPS or localhost)
const workletCode = `
class RingBuffer {
  constructor(capacitySamples) {
    this.capacity = capacitySamples;
    this.buf = new Float32Array(capacitySamples);
    this.writeIdx = 0;
    this.readIdx = 0;
    this.available = 0;
  }
  write(samples) {
    for (let i = 0; i < samples.length; i++) {
      this.buf[this.writeIdx] = samples[i];
      this.writeIdx = (this.writeIdx + 1) % this.capacity;
      if (this.available < this.capacity) {
        this.available++;
      } else {
        this.readIdx = (this.readIdx + 1) % this.capacity;
      }
    }
  }
  read() {
    if (this.available <= 0) return 0;
    const v = this.buf[this.readIdx];
    this.readIdx = (this.readIdx + 1) % this.capacity;
    this.available--;
    return v;
  }
  trimTo(maxAvailable) {
    while (this.available > maxAvailable) {
      this.readIdx = (this.readIdx + 1) % this.capacity;
      this.available--;
    }
  }
}

class JitterBufferProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    // Capacity generous enough for up to ~2s of stereo audio at 48kHz.
    this.ring = new RingBuffer(48000 * 2 * 2);
    this.targetSamples = Math.floor(sampleRate * 0.2 * 2);
    this.started = false;
    this.port.onmessage = (e) => {
      if (e.data.type === 'push') {
        this.ring.write(e.data.samples);
      } else if (e.data.type === 'setLatency') {
        this.targetSamples = Math.floor(sampleRate * (e.data.value / 1000) * 2);
        // Apply the new target immediately instead of only at the next
        // buffering phase, so the slider works live on a stream that's
        // already playing (not just at the moment it starts).
        this.ring.trimTo(this.targetSamples);
      }
    };
  }
  process(inputs, outputs) {
    const output = outputs[0];
    const left = output[0];
    const right = output[1] || output[0];

    if (!this.started) {
      if (this.ring.available < this.targetSamples) {
        left.fill(0); right.fill(0);
        return true;
      }
      this.started = true;
    }

    for (let i = 0; i < left.length; i++) {
      if (this.ring.available >= 2) {
        left[i] = this.ring.read();
        right[i] = this.ring.read();
      } else {
        left[i] = 0; right[i] = 0;
        this.started = false;
      }
    }
    return true;
  }
}
registerProcessor('jitter-buffer-processor', JitterBufferProcessor);
`;

async function setupAudioWorkletPath() {
  const blob = new Blob([workletCode], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  await audioCtx.audioWorklet.addModule(url);

  workletNode = new AudioWorkletNode(audioCtx, 'jitter-buffer-processor', {
    outputChannelCount: [2]
  });
  workletNode.connect(audioCtx.destination);
  workletNode.port.postMessage({ type: 'setLatency', value: targetLatencyMs });
}

// Fallback path for browsers that won't grant AudioWorklet on a non-HTTPS
// LAN address. ScriptProcessorNode is deprecated but doesn't require a
// secure context, so it works over plain http://<lan-ip>:port.
function setupScriptProcessorPath() {
  usingFallback = true;
  fallbackRing = new RingBuffer(48000 * 2 * 2);
  fallbackRing.targetSamples = Math.floor(audioCtx.sampleRate * (targetLatencyMs / 1000) * 2);
  let started = false;

  const bufferSize = 4096;
  const node = audioCtx.createScriptProcessor(bufferSize, 0, 2);
  node.onaudioprocess = (e) => {
    const left = e.outputBuffer.getChannelData(0);
    const right = e.outputBuffer.getChannelData(1);

    if (!started) {
      if (fallbackRing.available < fallbackRing.targetSamples) {
        left.fill(0); right.fill(0);
        return;
      }
      started = true;
    }

    for (let i = 0; i < left.length; i++) {
      if (fallbackRing.available >= 2) {
        left[i] = fallbackRing.read();
        right[i] = fallbackRing.read();
      } else {
        left[i] = 0; right[i] = 0;
        started = false;
      }
    }
  };
  node.connect(audioCtx.destination);
  workletNode = { port: { postMessage: () => {} } };
}

function pushSamples(samples) {
  if (usingFallback) {
    fallbackRing.write(samples);
  } else {
    // Transfer the underlying buffer instead of structured-cloning a plain
    // array — zero-copy handoff to the audio-render thread, no GC pressure.
    workletNode.port.postMessage({ type: 'push', samples }, [samples.buffer]);
  }
}

async function start() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });

    if (audioCtx.audioWorklet) {
      try {
        await setupAudioWorkletPath();
      } catch (workletErr) {
        console.warn('AudioWorklet failed, falling back:', workletErr);
        setupScriptProcessorPath();
      }
    } else {
      setupScriptProcessorPath();
    }

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    socket = new WebSocket(`${proto}://${location.host}/stream`);
    socket.binaryType = 'arraybuffer';

    socket.onopen = () => { setStatus('Connected — buffering...'); };
    socket.onclose = () => { setStatus('Disconnected'); };
    socket.onerror = () => { setStatus('Connection error — check the app is still streaming', true); };

    socket.onmessage = (event) => {
      const view = new Int16Array(event.data);
      const samples = new Float32Array(view.length);
      for (let i = 0; i < view.length; i++) {
        samples[i] = view[i] / 32768;
      }
      pushSamples(samples);
      setStatus('Streaming' + (usingFallback ? ' (compatibility mode)' : ''));
    };
  } catch (err) {
    console.error('Failed to start playback:', err);
    setStatus('Could not start audio: ' + err.message, true);
    startBtn.disabled = false;
    startBtn.textContent = 'Tap to Start Listening';
  }
}

startBtn.addEventListener('click', () => {
  start();
  startBtn.disabled = true;
  startBtn.textContent = 'Listening...';
});
</script>
</body>
</html>
